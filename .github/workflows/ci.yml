name: MoonBit quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/oracle-requirements.txt
      - run: python -m pip install -r tools/adapter-requirements.txt
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt && moon info && git diff --exit-code
      - run: python tools/generate_oracles.py && moon fmt && git diff --exit-code
      - run: moon check
      - run: moon test --target wasm-gc
      - run: moon test --target js
      - run: moon build --target js
      - name: Refresh actual browser engine
        run: node tools/refresh-engines.mjs
      - name: Check pinned upstream model generation
        run: node tools/generate-upstream-model.mjs && moon fmt && git diff --exit-code -- examples/moonthrift_model/model.mbt
      - run: node examples/run-upstream-model.mjs
      - run: node tools/test-moonthrift.mjs
      - run: node tools/test-demo.mjs
      - run: node tools/test-cli.mjs
      - run: node tools/test-output-file.mjs
      - run: node tools/test-schema-cli.mjs
      - run: node tools/test-generated.mjs
      - run: node tools/test-idl-reference.mjs --golden
      - run: node tools/test-schema-reference.mjs --golden
      - run: node tools/robustness.mjs
      - run: node tools/benchmark.mjs
      - run: python tools/test-interop.py
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: evidence/
